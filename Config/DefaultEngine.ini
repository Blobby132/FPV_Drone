; ---------------------------------------------------------------------------
; FPVDrone engine configuration
; ---------------------------------------------------------------------------

[/Script/EngineSettings.GameMapsSettings]
; Our GameMode works in ANY level (it spawns the drone and the test world itself),
; so it is the global default. Individual levels can still override it in World Settings.
GlobalDefaultGameMode=/Script/FPVDrone.FPVGameMode
; /Engine/Maps/Entry is an engine-provided (essentially empty) map, so the project
; is flyable without authoring a level. Any other level works too.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry

[/Script/Engine.PhysicsSettings]
; Fixed-rate physics for the flight controller.
; Async physics runs Chaos on its own fixed timestep (1/240 s = 0.0041667 s), independent
; of the render frame rate. The drone's flight controller runs inside a Chaos sim callback
; (FFPVDroneSimCallback) that executes once per physics step.
bTickPhysicsAsync=True
AsyncFixedTimeStepSize=0.0041667
; Fallback if async physics causes problems: set bTickPhysicsAsync=False and enable
; substepping instead (the controller uses each step's own dt, so it still works):
;   bSubstepping=True
;   MaxSubstepDeltaTime=0.0041667
;   MaxSubsteps=16
bSubstepping=False

[/Script/Engine.RendererSettings]
; Fully dynamic lighting (nothing is baked; all content is spawned at runtime).
r.AllowStaticLighting=False
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
; Motion blur makes fast FPV flight harder to read.
r.DefaultFeature.MotionBlur=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
